<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Realms</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="grade"></div>

    <header id="topbar">
      <div id="brand">REALMS</div>
      <div id="stats"></div>
      <div id="tools">
        <button id="speed">1x</button>
        <button id="mapbtn">Whole map</button>
        <button id="homebtn">My castle</button>
        <button id="fresh">New world</button>
      </div>
    </header>

    <!-- Review harness: switch the land draft, leave notes, copy a link back. -->
    <div id="review">
      <div class="rvhead">
        <span class="rvtitle">LAND DRAFT</span>
        <button class="rvtoggle" id="rvtoggle" title="hide / show">–</button>
      </div>
      <div class="rvbody">
        <div class="rvstyles" id="rvstyles"></div>
        <textarea id="notes" placeholder="What should change right here? Type it, then Copy note."></textarea>
        <div class="rvrow">
          <button id="copynote">Copy note + view link</button>
          <button id="copyview">Copy view link</button>
        </div>
        <div class="rvcopied" id="rvcopied"></div>
        <div class="rvhint">Keys 1-5 switch drafts · H your castle · F whole map · scroll to zoom</div>
      </div>
    </div>

    <aside id="panel"></aside>
    <section id="log"></section>
    <div id="flash"></div>

    <script>
      var BUILD = "20261109.061212";
    </script>
    <script src="dist/game.js?v=20261109.061212"></script>
  </body>
</html>
