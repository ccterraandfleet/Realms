<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/"}}</script>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { Atlas } from './forge.js';
import { buildSkeleton, buildSoldier, assemble, soldierMaterials, animate } from './soldier.js';

const Q = new URLSearchParams(location.search);
const SIDE = Q.get('side') === '1';
const W = 760, H = 1000;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const atlas = await new Atlas(new THREE.TextureLoader()).ready();
const man = (() => {
  const rig = buildSkeleton();
  const mats = soldierMaterials(atlas.m, 0x2f6f9e);
  const parts = buildSoldier(rig, mats, { kind: 'sword', helm: 'nasal', shield: 'none' });
  return { ...assemble(rig, parts), rig, parts };
})();
scene.add(man.root);

/* strip everything to flat white so the outline is all that is measured */
let overridden = 0, skinned = 0;
man.root.traverse((o) => {
  if (!o.isMesh) return;
  if (o.isSkinnedMesh) skinned++;
  o.material = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  o.castShadow = false; o.receiveShadow = false; o.frustumCulled = false;
  overridden++;
});

/* ORTHOGRAPHIC: no perspective foreshortening, so pixel ratios equal real ratios */
/* THE FRUSTUM MUST MATCH THE VIEWPORT ASPECT or the image is stretched and every
 * pixel ratio measured off it is wrong. Height is fixed in metres and width
 * follows from the aspect, so both axes have the same pixels-per-metre. */
const VIEW_H = 2.06;
const ASPECT = W / H;
const cam = new THREE.OrthographicCamera(-VIEW_H * ASPECT / 2, VIEW_H * ASPECT / 2, 1.03, -1.03, 0.1, 20);
/* centre the frustum on the BODY, not on the camera height */
if (SIDE) { cam.position.set(6, 0.9, 0); cam.lookAt(0, 0.9, 0); }
else { cam.position.set(0, 0.9, 6); cam.lookAt(0, 0.9, 0); }
cam.updateProjectionMatrix();
const PX_PER_M = W / (VIEW_H * ASPECT);
man.root.position.y = 0.02;
animate(man.rig, 0, 'idle');
renderer.render(scene, cam);

let sceneRoots = 0;
scene.children.forEach((c) => { if (c.type === 'Group' || c.isGroup) sceneRoots++; });
/* which mesh owns the top of the figure? measured in world space after posing */
const perMesh = [];
man.root.traverse((o) => {
  if (!o.isMesh) return;
  o.geometry.computeBoundingBox();
  const bb = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
  perMesh.push({ mat: (o.material.name || 'm'), y: [+bb.min.y.toFixed(2), +bb.max.y.toFixed(2)],
                 x: [+bb.min.x.toFixed(2), +bb.max.x.toFixed(2)], verts: o.geometry.attributes.position.count });
});
perMesh.sort((a, b) => b.y[1] - a.y[1]);
window.__sil = { perMesh, 
  inventory: { sceneChildren: scene.children.length, groups: sceneRoots, meshes: overridden, skinnedMeshes: skinned },
  ortho: { pxPerM: +PX_PER_M.toFixed(2), viewH: VIEW_H, widthM: +(VIEW_H * ASPECT).toFixed(3), topY: 1.57 },
  side: SIDE,
};
</script></body></html>
