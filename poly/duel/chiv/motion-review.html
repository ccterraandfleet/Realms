<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Realms motion verification</title>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/"}}</script>
<style>body{margin:0;background:#18212b;color:#e1e7ec;font:14px system-ui}header{padding:16px;display:flex;gap:16px;align-items:center}canvas{display:block}select,button,input{font:inherit}footer{padding:12px;color:#a8bac9}</style></head><body>
<header><strong>REALMS · captured combat review</strong><select id="attack"><option value="Slash:Left">Left cut</option><option value="Slash:Right">Right cut</option><option value="Overhead:Down">Overhead</option><option value="Stab:None">Thrust</option></select><button id="play">Pause</button><input id="time" type="range" min="0" max="1" step="0.001" value="0"><span id="phase"></span></header><div id="view"></div><footer>Front · quarter · side · rear. Same Actor.update() and motion data as the game. CMU swordplay cuts and thrust.</footer>
<script type="module">
import * as THREE from 'three';
import {initActors,makeActor,loadSwings} from './soldieractor.js?v=motion-v5';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight-110);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
document.querySelector('#view').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#18212b');scene.add(new THREE.HemisphereLight(0xe0edff,0x5d584b,2));const key=new THREE.DirectionalLight(0xffe4c2,3);key.position.set(-3,5,5);scene.add(key);
const camera=new THREE.PerspectiveCamera(33,innerWidth/(innerHeight-110),.05,100);camera.position.set(0,1.9,7.4);camera.lookAt(0,1,0);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x34414a,roughness:1}));scene.add(floor);scene.add(new THREE.GridHelper(20,40,0x546270,0x3b4c59));
await initActors(new THREE.TextureLoader());loadSwings();await new Promise(r=>setTimeout(r,300));
const actors=[0,.7,Math.PI/2,Math.PI].map((yaw,i)=>{const a=makeActor({tint:i===3?0x965345:0x426883,helm:'kettle',kind:'sword',shield:'kite'});a.noSmoothing=true;a.root.position.x=(i-1.5)*1.75;a.root.rotation.y=yaw;scene.add(a.root);return a;});
let playing=true,t=0,last=performance.now();
const select=document.querySelector('#attack'),slider=document.querySelector('#time');
const durations=[.35,.225,.475,.8],phases=['holding','windup','release','recovery'];
function draw(at=t){
 let s=at*1.85,p=0;while(p<3 && s>durations[p])s-=durations[p++];
 const [name,dir]=select.value.split(':');const state=phases[p],u=s/durations[p];
 for(const a of actors)a.update(1/60,{alive:true,state,guard:false,attack:{name,dir,type:name.toLowerCase()},phaseInfo:()=>({phase:state,u})});
 renderer.render(scene,camera);slider.value=at;document.querySelector('#phase').textContent=state+' '+Math.round(u*100)+'%';
}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';};slider.oninput=()=>{playing=false;t=+slider.value;draw();};select.onchange=()=>{t=0;draw();};
window.__review={actors,scene,renderer,camera,set:(attack,phase,u)=>{playing=false;select.value=attack;const i=phases.indexOf(phase);t=(durations.slice(0,i).reduce((a,b)=>a+b,0)+durations[i]*u)/1.85;draw();},draw};window.__ready=true;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)t=(t+dt/1.85)%1;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
