<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Realms | Resident movement check</title><style>*{box-sizing:border-box}body{margin:0;background:#283238;color:#fff;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:#142026ee;text-align:center;min-width:min(360px,95vw)}button{color:white;background:#34494a;padding:8px 14px;border:1px solid #aaa;border-radius:5px;margin:5px}button[aria-pressed=true]{background:#d6b77c;color:#181611}</style><script type=importmap>{"imports":{"three":"./lib/three.module.js"}}</script><canvas></canvas><aside><b>Rowan · infantry bearing</b><br><button id=a>Fieldhand</button><button id=b>Infantryman</button><div id=status>Loading the resident…</div></aside><script type=module>import * as T from 'three';import{makeActor,initActors}from './resident-rig.js?v=infantry1';import{remotePose}from './resident-playback.js';import{RGBELoader}from './lib/loaders/RGBELoader.js';import{Fighter}from './chiv.core.js';const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=T.ACESFilmicToneMapping;const scene=new T.Scene();scene.background=new T.Color('#9dabad');const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.05,160);const sun=new T.DirectionalLight('#efe4d0',1.1);sun.position.set(-4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(512,512);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,far:80});sun.shadow.normalBias=.018;scene.add(sun,sun.target,new T.HemisphereLight('#c6d2d0','#625947',.18));const hdr=await new RGBELoader().loadAsync('./assets/overcast.hdr');hdr.mapping=T.EquirectangularReflectionMapping;const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(hdr).texture;pm.dispose();
const loader=new T.TextureLoader(),map=await loader.loadAsync('./assets/road/color.webp');map.colorSpace=T.SRGBColorSpace;map.wrapS=map.wrapT=T.RepeatWrapping;map.repeat.set(60,60);const floor=new T.Mesh(new T.PlaneGeometry(120,120),new T.MeshStandardMaterial({map,color:'#696c60',roughness:.97}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);await initActors(loader);
