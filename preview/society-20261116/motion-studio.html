<!doctype html><html><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><title>Realms | Motion inspection</title><style>body{margin:0;background:#151b20;color:#e8deca;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;left:24px;top:20px;padding:18px;background:#10171ce8;border:1px solid #97826360}h1{font:25px Georgia;margin:0 0 6px}small{color:#bac4bd}select,button{padding:9px;margin:12px 5px 0 0;background:#263137;color:inherit;border:1px solid #748077}#readout{margin-top:12px;max-width:380px;line-height:1.6}footer{position:fixed;bottom:20px;left:24px;background:#10171cdd;padding:12px}</style><script type="importmap">{"imports":{"three":"./lib/three.module.js?v=cargo-frame-20261117"}}</script></head><body><canvas id="canvas"></canvas><aside><h1>REALMS / MOTION INSPECTION</h1><small>Actual game rig, materials, combat phases and CMU capture.</small><br><select id="mode"><option value="walk">Walk</option><option value="run">Run</option><option value="idle">Idle</option><option value="Slash">Left cut</option><option value="Right">Right cut</option><option value="Overhead">Overhead</option><option value="Stab">Thrust</option><option value="guard">Guard</option></select><select id="angle"><option value="front">Front</option><option value="side">Side</option><option value="rear">Rear</option><option value="quarter">Three-quarter</option><option value="civilian-face">Civilian face</option><option value="soldier-face">Soldier face</option></select><select id="skin"><option value="weathered">Freckled light</option><option value="umber">Weathered deep</option></select><button id="pause">Pause</button><div id="readout">Loading capture and materials.</div></aside><footer>Left: civilian. Right: soldier. This is an inspection stage, not a finished gameplay presentation.</footer><script type="module">
import * as T from 'three';import{initActors,makeActor}from'./soldieractor.js?v=cargo-frame-20261117';import{Fighter,Duel}from'./chiv.core.js?v=cargo-frame-20261117';import{RGBELoader}from'./lib/loaders/RGBELoader.js?v=cargo-frame-20261117';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.98;
const scene=new T.Scene();scene.background=new T.Color('#9dabad');const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.05,160);const sun=new T.DirectionalLight('#efe4d0',1.1);sun.position.set(-4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,far:80});sun.shadow.normalBias=.018;scene.add(sun,sun.target,new T.HemisphereLight('#c6d2d0','#625947',.18));const hdr=await new RGBELoader().loadAsync('./assets/overcast.hdr');hdr.mapping=T.EquirectangularReflectionMapping;const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(hdr).texture;pm.dispose();
const loader=new T.TextureLoader(),map=await loader.loadAsync('./assets/road/color.webp');map.colorSpace=T.SRGBColorSpace;map.wrapS=map.wrapT=T.RepeatWrapping;map.repeat.set(60,60);const floor=new T.Mesh(new T.PlaneGeometry(120,120),new T.MeshStandardMaterial({map,color:'#696c60',roughness:.97}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);await initActors(loader);
const skinStyle=new URLSearchParams(location.search).get('skin')==='umber'?'umber':'weathered';document.querySelector('#skin').value=skinStyle;document.querySelector('#skin').onchange=e=>{const u=new URL(location.href);u.searchParams.set('skin',e.target.value);location.href=u;};const actors=[makeActor({skinStyle,kind:'none',civilian:true,helm:'coif',shield:'none',tint:0x52644d,shadows:true}),makeActor({skinStyle,kind:'sword',helm:'nasal',shield:'kite',tint:0x315c70,shadows:true})];actors.forEach(a=>scene.add(a.root));let time=0,distance=0,playing=true,mode='walk',angle='front',manual=false;let f,duel;const reset=()=>{f=new Fighter('actor',1,'Longsword');duel=new Duel(f,new Fighter('dummy',1,'Longsword'),{contactTest:()=>false});};reset();document.querySelector('#mode').onchange=e=>{mode=e.target.value;reset();};document.querySelector('#angle').onchange=e=>angle=e.target.value;document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'Pause':'Play';};
function step(dt=1/30){time+=dt;const speed=mode==='walk'?1.35:mode==='run'?3.8:0;distance+=speed*dt;let input={guard:mode==='guard'};if(['Slash','Right','Overhead','Stab'].includes(mode)&&f.state==='idle'){input.attack=mode==='Right'?'Slash':mode;input.alt=mode==='Right';}duel.step(dt,input,{});for(let i=0;i<2;i++){const a=actors[i];a.root.position.set(i? .68:-.68,0,distance);a.update(dt,i===1?f:new Fighter('civilian',1,'Longsword'),speed);}floor.position.z=distance;map.offset.y=-distance*.5;sun.target.position.set(0,1,distance);sun.position.set(-4,8,distance+5);const close=angle.endsWith('-face'),side=angle==='civilian-face'?-.68:.68;const offsets={front:[0,1.45,4.9],side:[4.9,1.5,0],rear:[0,1.5,-4.9],quarter:[3.3,1.6,4.2]},o=close?[side,1.70,.70]:offsets[angle];camera.position.set(o[0],o[1],distance+o[2]);camera.lookAt(close?side:0,close?1.674:.94,distance);document.querySelector('#readout').textContent=`${mode} · ${angle} · ${f.state}\nCMU locomotion applications: ${window.__locoCalls||0}. Civilian upper-body applications: ${window.__civilianMotionUses||0}.`;renderer.render(scene,camera);}
window.__studio={step,mode:v=>{mode=v;document.querySelector('#mode').value=v;reset();},angle:v=>{angle=v;document.querySelector('#angle').value=v;},manual:v=>manual=v,actors,renderer,scene,get fighter(){return f;},get distance(){return distance;}};let before=performance.now();function loop(now){const dt=Math.min(.1,(now-before)/1000);before=now;if(!manual&&playing)step(dt);requestAnimationFrame(loop);}step();requestAnimationFrame(loop);
</script></body></html>
