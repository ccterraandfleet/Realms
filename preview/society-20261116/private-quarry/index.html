<!doctype html><title>Private quarry material and scale study</title><style>*{margin:0}canvas{display:block}</style><script type=module>import * as T from '../lib/three.module.js';import{sanctuary}from'./sanctuary.js';const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);r.shadowMap.enabled=true;r.toneMapping=T.ACESFilmicToneMapping;const s=new T.Scene();s.background=new T.Color(0x778d99);s.fog=new T.FogExp2(0x738790,.05);s.add(sanctuary(),new T.HemisphereLight(0xc4dcf2,0x493b33,.74));let l=new T.DirectionalLight(0xe2f0ff,2.45);l.position.set(-6,7,-4);l.castShadow=true;s.add(l);let c=new T.PerspectiveCamera(57,innerWidth/innerHeight,.08,100);window.frame=u=>{c.position.set(-2.6+u*3,1.66,7.1-u*1.8);c.lookAt(-.25,3.4,-1);r.render(s,c)};frame(0);T.DefaultLoadingManager.onLoad=()=>{frame(0);window.ready=true};</script>
